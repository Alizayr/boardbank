<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>(function(){try{var t=localStorage.getItem("bb_theme")||"auto",f=localStorage.getItem("bb_font")||"m",d=document.documentElement;d.dataset.theme=(t==="dark"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches))?"dark":"light";d.dataset.font=f}catch(e){}})()</script>
<title>BoardBank</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f172a; --mute:#64748b; --line:#e2e8f0; --line-2:#cbd5e1; --bg:#f8fafc; --card:#fff; --surf:#fff;
  --acc:#3157d5; --acc-h:#2748b8; --acc-soft:#eef2ff; --on-acc:#fff;
  --blue:var(--acc);
  --green:#22a55b; --green-d:#15803d; --green-bg:#ecfdf3;
  --red:#dc2626; --red-bg:#fef2f2;
  --amber:#f59e0b; --amber-bg:#fffbeb; --amber-d:#92400e;
  --hover:#f1f5f9; --soft:#f8fafc; --track:#e2e8f0; --faint:#94a3b8; --ink2:#334155; --ink3:#475569;
  --danger-line:#fecaca; --fc-bar:#c7d2fe; --heat0:#f1f5f9; --heat1:#dbe4ff; --heat2:#9bb3ff;
  --shadow:rgba(15,23,42,.1); --exp-line:rgba(15,23,42,.12); --scrim:rgba(15,23,42,.4); --veil:rgba(255,255,255,.7); --veil2:rgba(255,255,255,.8);
  --r:12px; --r-s:8px; --fz:1;
  --sans:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme=dark]{
  --ink:#e7eaf3; --mute:#98a3b8; --line:#2a3246; --line-2:#3a4560; --bg:#0e131d; --card:#161c2a; --surf:#161c2a;
  --acc:#7b9bff; --acc-h:#9bb4ff; --acc-soft:#1c2646; --on-acc:#0b1226;
  --green:#3cc97f; --green-d:#7be3ae; --green-bg:#11301f;
  --red:#f26b6b; --red-bg:#3b1719;
  --amber:#f2b640; --amber-bg:#3a2e12; --amber-d:#f7d37a;
  --hover:#212a3e; --soft:#121826; --track:#2a3347; --faint:#6f7b93; --ink2:#c8d0e2; --ink3:#b3bdd2;
  --danger-line:#5a2528; --fc-bar:#33406b; --heat0:#212a3e; --heat1:#27386b; --heat2:#3f5bb8;
  --shadow:rgba(0,0,0,.45); --exp-line:rgba(255,255,255,.16); --scrim:rgba(0,0,0,.6); --veil:rgba(255,255,255,.08); --veil2:rgba(14,19,29,.85);
}
html[data-font=s]{--fz:.92} html[data-font=l]{--fz:1.12} html[data-font=xl]{--fz:1.25}
*{box-sizing:border-box}
html{color-scheme:light}
html[data-theme=dark]{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:400 calc(15px * var(--fz))/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ic{flex:none;vertical-align:middle}
h1,h2,h3,h4,p{margin:0}
h3{font-weight:600}
.muted{color:var(--mute)} .sm{font-size:calc(13px * var(--fz))}

/* shell */
#shell{display:flex;min-height:100vh}
#side{width:260px;flex:none;background:var(--surf);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}
#content{flex:1;min-width:0;background:var(--bg)}
body.insess #side{display:none}
.brand{font:700 calc(22px * var(--fz))/1 var(--sans);color:var(--ink)}
.brand b{font-weight:inherit;color:inherit}
.brand-s{padding:4px 12px 22px}
.card-brand{text-align:center;font-size:calc(28px * var(--fz));margin:6px 0 4px}
.hi{font:600 calc(15px * var(--fz)) var(--sans);margin:0 12px 18px;cursor:pointer}
.lbl{font:500 calc(13px * var(--fz)) var(--sans);color:var(--mute);margin:18px 12px 6px}
.nav{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-radius:10px;padding:10px 12px;text-align:left;font-size:calc(15px * var(--fz));color:var(--ink2)}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--acc-soft);font-weight:600;color:var(--acc)}
.nav span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dueb{font-style:normal;background:var(--amber-bg);color:var(--amber-d);border-radius:99px;font-size:calc(12px * var(--fz));font-weight:600;padding:1px 8px}
hr{border:0;border-top:1px solid var(--line);margin:14px 6px}
#mbar{display:none}
main{max-width:1080px;margin:0 auto;padding:20px 32px 120px}
body.insess main{max-width:1240px;padding-top:0}

/* buttons */
.btn{background:var(--acc);color:var(--on-acc);border:1px solid var(--acc);border-radius:10px;padding:10px 20px;font-weight:600}
.btn:hover{background:var(--acc-h);border-color:var(--acc-h)}
.btn:disabled{background:var(--track);border-color:var(--track);color:var(--faint);cursor:not-allowed}
.ghost{background:var(--surf);border:1px solid var(--line-2);border-radius:10px;padding:9px 16px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.ghost:hover{background:var(--hover)}
.ghost:disabled{border-color:var(--line);color:var(--faint);cursor:not-allowed;background:var(--soft)}
.ghost.danger{color:var(--red);border-color:var(--danger-line)}
.ghost.danger:hover{background:var(--red-bg)}
.sq{width:40px;height:40px;border-radius:10px;border:1px solid var(--line-2);background:var(--surf);display:grid;place-items:center;padding:0}
.sq:hover{background:var(--hover)}
.sq:disabled{background:var(--hover);border-color:var(--line);color:var(--faint);cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.crumb{display:flex;align-items:center;gap:12px;margin-bottom:24px;font-size:calc(14px * var(--fz));flex-wrap:wrap}
.crumb .sep{color:var(--faint)}
.crumb a{color:var(--mute);cursor:pointer;background:none;border:0;padding:0}
.crumb a:hover{color:var(--ink)}
.crumb a.sq{color:var(--ink)}
.crumb b{font-weight:600}

/* home */
.hero{display:block}
.hero h1{font:600 calc(28px * var(--fz))/1.2 var(--sans);margin:4px 0 6px}
.big{font:600 calc(56px * var(--fz))/1 var(--sans);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.fc{display:flex;gap:10px;align-items:flex-end;height:120px;margin-top:16px}
.fc div{flex:1;text-align:center;font-size:calc(12px * var(--fz));color:var(--mute);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.fc i{display:block;background:var(--fc-bar);border-radius:6px 6px 2px 2px;min-height:4px;margin-bottom:6px}
.fc div.today i{background:var(--acc)}
.fc b{color:var(--ink);font-size:calc(13px * var(--fz));font-weight:600}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;margin-top:16px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--heat0)}
.heat i.l1{background:var(--heat1)}.heat i.l2{background:var(--heat2)}.heat i.l3{background:var(--acc)}
.heat i.now{outline:2px solid var(--ink);outline-offset:1px}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:14px}
.excard{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:20px;text-align:left;display:block;width:100%}
.excard:hover{border-color:var(--acc)}
.excard .ic{color:var(--acc)}
.excard h3{font-size:calc(17px * var(--fz));margin:10px 0 2px}
h2.sec{font:600 calc(20px * var(--fz)) var(--sans);margin:32px 0 0}

/* curriculum */
.title{font:600 calc(28px * var(--fz))/1.2 var(--sans)}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin:12px 0 24px;gap:14px;flex-wrap:wrap}
.topic{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
.trow{display:grid;grid-template-columns:minmax(140px,1fr) 2fr 48px;gap:24px;align-items:center;width:100%;background:none;border:0;padding:18px 22px;text-align:left;border-radius:var(--r)}
.trow:hover{background:var(--soft)}
.tinfo{display:flex;flex-direction:column;min-width:0}
.tn{font-weight:600;font-size:calc(16px * var(--fz));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmeta{font-size:calc(13px * var(--fz));color:var(--mute)}
.pbar{display:flex;height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.pbar i{display:block;height:100%}
.pbar i.c{background:var(--green)}
.pbar i.w{background:var(--red)}
.tscore{font:600 calc(24px * var(--fz)) var(--sans);text-align:right;font-variant-numeric:tabular-nums}
.tbody{padding:0 22px 22px}
.stats{display:grid;grid-template-columns:repeat(6,1fr);background:var(--soft);border-radius:10px;padding:18px 8px}
.stats div{padding:0 16px;border-left:1px solid var(--line)}
.stats div:first-child{border-left:0}
.stats b{display:block;font-size:calc(13px * var(--fz));font-weight:500;color:var(--mute)}
.stats span{font:600 calc(20px * var(--fz)) var(--sans)}
.stats i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle}
.formula{margin:18px 0;color:var(--mute);font-size:calc(14px * var(--fz))}
.formula code{display:block;margin-top:12px;background:var(--hover);border-radius:10px;padding:12px 16px;font:400 calc(13px * var(--fz))/1.6 var(--sans)}

/* setup */
.setup{max-width:780px;margin:0 auto}
.setup .head{padding:24px 28px;border-bottom:1px solid var(--line)}
.setup .head h2{font:600 calc(22px * var(--fz)) var(--sans)}
.setup .sec{padding:24px 28px;border-bottom:1px solid var(--line)}
.setup .sec:last-child{border-bottom:0}
.setup h3{font-size:calc(17px * var(--fz))}
.setup input[type=number],.setup select{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;background:var(--surf);margin-top:14px;font-size:calc(15px * var(--fz))}
.tm{display:flex;gap:10px;align-items:center;margin-top:10px}
.tm input{width:84px!important;text-align:center;margin:0!important;padding:10px!important}
.switch{width:46px;height:26px;border-radius:99px;border:0;background:var(--line-2);position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--acc)}
.switch.on::after{left:23px}
.sbar{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-top:1px solid var(--line);padding:14px 32px;display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap;z-index:6}
body:not(.insess) .sbar{left:260px}
.sbar .l{display:flex;align-items:center;gap:12px}

/* session */
.stop{position:sticky;top:0;z-index:7;background:var(--surf);border-bottom:1px solid var(--line);margin:0 -32px 24px;padding:12px 32px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qsel{background:none;border:0;font:600 calc(18px * var(--fz)) var(--sans);display:flex;align-items:center;gap:6px;padding:0 8px 0 0}
.stop .timer{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--mute);font-weight:600}
.stop .timer.low{color:var(--red)}
.navpop{position:absolute;top:100%;left:20px;margin-top:6px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:0 8px 24px var(--shadow);display:grid;grid-template-columns:repeat(8,40px);gap:6px;max-height:60vh;overflow:auto}
.cell{position:relative;width:40px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surf);font-weight:600;font-size:calc(13px * var(--fz));padding:0}
.cell.cur{border-color:var(--acc);border-width:2px}
.cell.ans{background:var(--acc-soft)}
.cell.ok{background:var(--green-bg);border-color:var(--green)}
.cell.no{background:var(--red-bg);border-color:var(--red)}
.cell.fl::after{content:"";position:absolute;top:-1px;right:-1px;border:6px solid transparent;border-top-color:var(--amber);border-right-color:var(--amber)}
.slay{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.qcard{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:32px 34px}
.qimg{display:block;max-width:100%;height:auto;margin:14px 0;border:1px solid var(--line);border-radius:10px;background:#fff}
.vig{font-size:calc(17px * var(--fz));color:var(--ink3);white-space:pre-wrap;margin-bottom:18px;line-height:1.7}
.qq{font-size:calc(18px * var(--fz));font-weight:600;white-space:pre-wrap;margin-bottom:24px;line-height:1.55}
.opt{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:var(--surf);border-radius:12px;padding:16px 18px;margin-bottom:10px;cursor:pointer;font-size:calc(16px * var(--fz))}
.opt:hover{border-color:var(--line-2);background:var(--soft)}
.radio{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);background:var(--surf)}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt.sel .radio{border:6px solid var(--acc)}
.opt .txt{flex:1;white-space:pre-wrap}
.opt.elim .txt{text-decoration:line-through;color:var(--faint)}
.opt .x{font-size:calc(12px * var(--fz));color:var(--mute);padding:4px 8px;border-radius:6px;border:1px solid transparent}
.opt .x:hover{border-color:var(--line);background:var(--surf)}
.submit{width:100%;border:0;border-radius:10px;padding:16px;font-size:calc(16px * var(--fz));font-weight:600;background:var(--acc);color:var(--on-acc);margin-top:14px}
.submit:hover{background:var(--acc-h)}
.submit:disabled{background:var(--track);color:var(--faint);cursor:not-allowed}
.ocard{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:10px;background:var(--surf)}
.ocard.good{background:var(--green-bg);border-color:var(--green)}
.ocard.bad{background:var(--red-bg);border-color:var(--red)}
.ohead{display:flex;align-items:center;gap:12px;font-size:calc(16px * var(--fz));font-weight:500}
.ohead .t{flex:1;white-space:pre-wrap}
.ocard.good .ic:first-child{color:var(--green-d)} .ocard.bad .ic:first-child{color:var(--red)}
.tagc{font-size:calc(12px * var(--fz));font-weight:600;padding:2px 10px;border-radius:99px;background:var(--surf)}
.oexp{margin:12px 0 0 4px;padding:2px 0 2px 16px;border-left:2px solid var(--exp-line);white-space:pre-wrap;color:var(--ink2)}
.showexp{display:block;width:100%;margin-top:12px;background:var(--veil);border:0;border-radius:8px;padding:10px;font-weight:600}
.showexp:hover{background:var(--surf)}
.kf{border:1px solid var(--line);border-radius:16px;padding:26px 28px;margin:20px 0;background:var(--surf)}
.kf h3{display:flex;align-items:center;gap:12px;font-size:calc(19px * var(--fz));margin-bottom:12px}
.kf h4{font-size:calc(15px * var(--fz));font-weight:600;margin:16px 0 8px}
.kf .body{white-space:pre-wrap;color:var(--ink2)}
.kf .clamp{max-height:230px;overflow:hidden;position:relative}
.kf .clamp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(transparent,var(--surf))}
.kf .more{background:none;border:0;font-weight:600;font-size:calc(15px * var(--fz));color:var(--acc);margin-top:10px;display:flex;align-items:center;gap:6px;padding:0}
.keyline{background:var(--amber-bg);border-radius:10px;padding:12px 16px;margin:6px 0 4px}
.rate{border:1px solid var(--line);border-radius:16px;padding:22px 26px;margin:20px 0;background:var(--surf)}
.rate h3{font-size:calc(17px * var(--fz))}
.rbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.rb{border:1px solid var(--line);border-radius:10px;padding:12px 8px;background:var(--surf);text-align:center}
.rb b{display:block;font-size:calc(15px * var(--fz));font-weight:600}
.rb span{font-size:calc(13px * var(--fz));color:var(--mute)}
.rb.hard{background:var(--red-bg)} .rb.medium{background:var(--amber-bg)} .rb.easy{background:var(--green-bg)}
.rb:hover{border-color:var(--ink)}
.rb.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.again{background:var(--red-bg);border-radius:10px;padding:12px 16px;margin-top:14px}
.hint{background:var(--amber-bg);border-radius:10px;padding:12px 16px;margin-bottom:18px}
.next{display:flex;justify-content:space-between;gap:10px;margin-top:8px}
.side .box{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:16px}
.side{position:sticky;top:84px}
.score{display:flex;justify-content:space-between;align-items:baseline}
.score h3{font-size:calc(17px * var(--fz))}
.score b{font:600 calc(36px * var(--fz)) var(--sans);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--track);margin:14px 0 18px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.leg{display:flex;align-items:center;gap:10px;margin:8px 0;color:var(--ink3)}
.leg i{width:10px;height:10px;border-radius:50%}
.leg b{margin-left:auto;font-weight:600;color:var(--ink)}
.notes textarea{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;min-height:110px;resize:vertical;background:var(--surf);margin-top:10px}
.fab{position:fixed;right:24px;bottom:24px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;gap:6px;box-shadow:0 8px 24px var(--shadow);z-index:8}
.fab button{width:40px;height:40px;border-radius:10px;border:0;background:var(--surf);display:grid;place-items:center;padding:0}
.fab button.on{background:var(--amber-bg);color:var(--amber-d)}
.fab button:hover{background:var(--hover)}

/* tables, manage */
.score100{font:600 calc(56px * var(--fz))/1 var(--sans);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:calc(13px * var(--fz));color:var(--mute);font-weight:500}
.pill{font-weight:600;font-size:calc(12px * var(--fz));padding:2px 10px;border-radius:99px}
.pill.ok{background:var(--green-bg);color:var(--green-d)} .pill.no{background:var(--red-bg);color:var(--red)} .pill.na{background:var(--amber-bg);color:var(--amber-d)}
.tabs{display:flex;gap:6px;margin:16px 0}
.tab{border:1px solid var(--line);background:var(--surf);border-radius:99px;padding:8px 18px;font-weight:600}
.tab.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
label.f{display:block;font-weight:600;font-size:calc(14px * var(--fz));margin:18px 0 6px}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:10px 14px;background:var(--surf)}
textarea.in{resize:vertical}
.chip{display:inline-block;background:var(--hover);border-radius:99px;padding:2px 10px;font-size:calc(12px * var(--fz));margin:0 5px 4px 0}
.qrow{display:flex;gap:14px;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qrow .s{flex:1;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.oe{display:flex;gap:12px;align-items:flex-start;margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:12px}
.oe .cp{display:flex;gap:6px;align-items:center;padding-top:10px;white-space:nowrap;font-weight:600}
.oe-f{flex:1;display:grid;gap:8px}
.empty{text-align:center;padding:44px 12px;color:var(--mute)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:10px;z-index:40}
.ov{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:50;padding:16px}
.ov .box{background:var(--surf);border-radius:16px;padding:24px;max-width:420px;width:100%}
.note{background:var(--amber-bg);border-radius:10px;padding:10px 14px;font-size:calc(13px * var(--fz));margin-bottom:16px}

body.insess #mbar{display:none}
.seg{display:flex;gap:4px;background:var(--hover);border-radius:10px;padding:4px;margin:6px 0 14px}

.sp-l{font:500 calc(13px * var(--fz)) var(--sans);color:var(--mute);margin:4px 2px}
.ocard.good,.ocard.bad{border-width:2px}
.sec .muted{font-weight:500}
@media (max-width:960px){
  #side{position:fixed;left:0;top:0;z-index:30;transform:translateX(-102%);transition:transform .2s;width:285px;box-shadow:0 0 40px var(--shadow)}

  #mbar{padding:10px 16px;background:var(--surf);border-bottom:1px solid var(--line)}
  #mbar #menubtn{display:grid}
  #mbar .brand{display:inline}
  body:not(.insess) .sbar{left:0}
  .slay{grid-template-columns:1fr}
  .side{position:static}
  .grid2{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(3,1fr);row-gap:18px}
  .stats div:nth-child(4){border-left:0}
  .trow{grid-template-columns:1fr 44px;row-gap:12px}
  .trow .pbar{grid-column:1/-1;grid-row:2}
  main{padding:22px 16px 120px}
  .stop{margin:0 -16px 20px;padding:10px 16px}
  .qcard{padding:22px 18px;border-radius:14px}
  .navpop{grid-template-columns:repeat(6,40px)}
  .title,.hero h1{font-size:calc(24px * var(--fz))}
  .big{font-size:calc(44px * var(--fz))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#auth,#namebox{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:20px}#auth[hidden],#namebox[hidden],#au-nw[hidden]{display:none}

let state = { bank: [], results: {}, history: [], exams: [], cards: {}, marks: {}, notes: {}, daily: {}, name: 'Ali' };
let view = 'home', curExam = null, sess = null, timerId = null, editing = null;
let setup = null, openTopics = {}, sortBy = 'name', manageTab = 'questions', manageExam = 'all', bankQuery = '', bankLimit = 50, bankTimer = null, persistWorks = true;

/* ================= categories, preferences, share ================= */
const CATS = ['Internal Medicine', 'Surgery'];
let catCol = false;                                   // true once the "category" column exists in Supabase
const guessCat = n => /neuro|surg/i.test(String(n || '')) ? 'Surgery' : 'Internal Medicine';
const catOf = e => e.category || guessCat(e.name);
function catList() {
  const m = new Map(); state.exams.forEach(e => { const c = catOf(e); if (!m.has(c)) m.set(c, []); m.get(c).push(e); });

try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyPrefs); } catch (e) {}
function closeSetPop() { const el = $('#setpop'); if (el) el.hidden = true; }

  const t = pref('bb_theme', 'auto'), f = pref('bb_font', 'm');
  const seg = (items, cur, act, label) => `<div class="seg" role="group" aria-label="${label}">${items.map(([k, l]) => `<button class="${cur === k ? 'on' : ''}" data-act="${act}" data-k="${k}" aria-pressed="${cur === k}">${l}</button>`).join('')}</div>`;
  el.hidden = false;
  el.innerHTML = `<div class="sp-h"><b>${esc(state.name)}</b><div class="muted sm">${esc((me && me.email) || '')}</div></div>
    <div class="sp-l">Appearance</div>${seg(THEMES, t, 'theme', 'Appearance')}
    <div class="sp-l">Text size</div>${seg(FONTS, f, 'font', 'Text size')}
    <hr><button class="nav" data-act="logout">${ic('close')}<span>Sign out</span></button>`;
}
function toggleSetPop() { const el = $('#setpop'); if (el && !el.hidden) closeSetPop(); else renderSetPop(); }
const absUrl = u => /^(data:|https?:)/i.test(u) ? u : new URL(u, location.href).href;
function questionText(q) {
  const L = 'ABCDEFGH', ex = examById(q.exam);
  const imgs = [...String(q.stem).matchAll(IMG_RE), ...String(q.explanation || '').matchAll(IMG_RE)].map(m => m[1]).filter(u => !u.startsWith('data:'));
  const mine = sess && sess.ans && sess.ans[q.id] !== undefined ? L[sess.ans[q.id]] : '';
  const ca = q.options[q.correct];
  return [[ex && ex.name, (q.tags || [])[0]].filter(Boolean).join(' - '), noImg(q.stem), q.options.map((o, i) => `${L[i]}. ${o.text}`).join('\n'),
    mine ? `My answer: ${mine}` : '', `Correct answer: ${L[q.correct]}${ca ? ' (' + ca.text + ')' : ''}`,
    q.explanation ? 'Explanation:\n' + noImg(q.explanation) : '', ...imgs.map(u => 'Image: ' + absUrl(u))].filter(Boolean).join('\n\n');
}
async function shareQuestion() {
  const q = cur(); if (!q || q.stub) return;
  const text = questionText(q);
  if (navigator.share) { try { await navigator.share({ title: 'BoardBank question', text }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(text); toast('Question copied. Paste it anywhere to share.'); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Question copied. Paste it anywhere to share.'); } catch (_) { toast('Could not copy the question.'); }
    ta.remove();
  }
}

/* ================= storage (Supabase) ================= */
const sb = window.supabase.createClient('https://vlrgorcmrlugvipsvdjs.supabase.co', 'sb_publishable_4mQXmAzgM-RF69GHY2d9VA_MKLpzccT');
const orphanDel = new Set(); let hydrateBusy = false;
let loadErr = '', me = null, isAdmin = false, loaded = false, synced = { e: new Map(), q: new Map() };
const UD = ['results', 'history', 'cards', 'marks', 'notes', 'daily', 'name', 'named'];
const eRow = e => catCol ? ({ id: e.id, name: e.name, pass_mark: e.passMark, category: catOf(e) }) : ({ id: e.id, name: e.name, pass_mark: e.passMark });
const qRow = q => ({ id: q.id, exam_id: q.exam, stem: q.stem, options: q.options, correct: q.correct, explanation: q.explanation || '', objective: q.objective || '', hint: q.hint || '', tags: q.tags || [], difficulty: q.difficulty || 'Medium' });
const mapSnap = (rows) => new Map(rows.map(r => [r.id, JSON.stringify(r)]));
/* questions are compared by a short hash cached per object, so a save never re-serialises thousands of rows (and their images) again */
const hash53 = (str) => { let h1 = 0xdeadbeef, h2 = 0x41c6ce57; for (let i = 0, ch; i < str.length; i++) { ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909); return 4294967296 * (2097151 & h2) + (h1 >>> 0); };
const qSigs = new WeakMap();
const qSig = q => { let v = qSigs.get(q); if (v === undefined) { v = hash53(JSON.stringify(qRow(q))); qSigs.set(q, v); } return v; };
const qSnap = () => new Map(state.bank.filter(q => !q.stub).map(q => [q.id, qSig(q)]));
/* ---- light loading: at sign-in only id / exam / tags are fetched; the full text of a question is fetched when it is needed ---- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const retry = async (fn, tries = 3) => { for (let a = 0; ; a++) { const r = await fn(); if (!r.error || a >= tries - 1) return r; await sleep(700 * (a + 1)); } };
const mapQ = q => ({ id: q.id, exam: q.exam_id, stem: q.stem, options: q.options, correct: q.correct, explanation: q.explanation, objective: q.objective, hint: q.hint, tags: q.tags || [], difficulty: q.difficulty });
const stubQ = q => ({ id: q.id, exam: q.exam_id, stem: '', options: [], correct: 0, explanation: '', objective: '', hint: '', tags: q.tags || [], difficulty: q.difficulty, stub: true });
async function countQ(examId) {
  const r = await retry(() => { let b = sb.from('questions').select('id', { count: 'exact', head: true }); return examId ? b.eq('exam_id', examId) : b; });
  if (r.error) throw r.error; return r.count;
}
async function fetchAll(build, PAGE, total, workers = 4) {
  const page = i => retry(() => build().order('created_at').range(i * PAGE, i * PAGE + PAGE - 1));
  const sequential = async () => { const out = []; for (let i = 0; ; i++) { const r = await page(i); if (r.error) throw r.error; out.push(...r.data); if (r.data.length < PAGE) break; } return out; };
  if (total == null) return sequential();
  if (total === 0) return [];
  try {
    const pages = Math.ceil(total / PAGE), parts = new Array(pages); let next = 0;
    const worker = async () => { for (;;) { const i = next++; if (i >= pages) return; const r = await page(i); if (r.error) throw r.error; parts[i] = r.data; } };
    await Promise.all(Array.from({ length: Math.min(workers, pages) }, worker));
    const seen = new Set(), rows = parts.flat().filter(r => !seen.has(r.id) && seen.add(r.id));
    return rows.length === total ? rows : await sequential();      // paging was unstable: use the slow, safe way
  } catch (e) { console.warn('parallel load failed, using sequential', e); return sequential(); }
}
function mergeRow(idx, row) {
  const full = mapQ(row); let q = idx.get(row.id);
  if (q) { Object.assign(q, full); delete q.stub; } else { q = full; state.bank.push(q); idx.set(q.id, q); }
  if (isAdmin) synced.q.set(q.id, qSig(q));
}
const hydrating = {};
function hydrateExam(examId) {
  if (!state.bank.some(q => q.exam === examId && q.stub)) return Promise.resolve();
  return hydrating[examId] || (hydrating[examId] = (async () => {
    const total = await countQ(examId);
    const rows = await fetchAll(() => sb.from('questions').select('*').eq('exam_id', examId), 200, total, 4);
    const idx = new Map(state.bank.map(q => [q.id, q])); rows.forEach(r => mergeRow(idx, r));
  })().finally(() => { delete hydrating[examId]; }));
}
const hydrateAll = () => Promise.all(state.exams.map(e => hydrateExam(e.id)));
async function fetchByIds(ids, idx) {
  const chunks = []; for (let i = 0; i < ids.length; i += 100) chunks.push(ids.slice(i, i + 100));
  let n = 0;
  const worker = async () => { for (;;) { const c = chunks[n++]; if (!c) return; const r = await retry(() => sb.from('questions').select('*').in('id', c)); if (r.error) throw r.error; r.data.forEach(row => mergeRow(idx, row)); } };
  await Promise.all(Array.from({ length: Math.min(4, chunks.length) }, worker));
}
/* a big session starts as soon as the first questions are in; the rest keep loading in the background */
async function loadRest(s, rest, idx) {
  const todo = rest.slice();
  const worker = async () => { while (todo.length && sess === s) { const c = todo.splice(0, 100); try { await fetchByIds(c, idx); } catch (e) { console.error(e); s.loadFailed = true; todo.length = 0; } } };
  await Promise.all([worker(), worker(), worker()]);
  if (!s.loadFailed && sess === s) s.pending = null;
}
function dropMissing(s, idx) {          // questions deleted on the server meanwhile
  const keep = s.ids.filter(id => idx.get(id) && !idx.get(id).stub);
  if (keep.length !== s.ids.length) { s.ids = keep; if (s.idx >= keep.length) s.idx = Math.max(0, keep.length - 1); }
}
async function ensureSessionLoaded(s) {
  const idx = new Map(state.bank.map(q => [q.id, q]));
  if (s.pending) await s.pending;
  const left = s.ids.filter(id => idx.get(id) && idx.get(id).stub);
  if (left.length) await fetchByIds(left, idx);
  dropMissing(s, idx);
}
const curLoading = new Set();
function loadCur(id) {
  if (curLoading.has(id)) return; curLoading.add(id); const s = sess; let failed = false;
  fetchByIds([id], new Map(state.bank.map(q => [q.id, q]))).then(() => dropMissing(s, new Map(state.bank.map(q => [q.id, q]))), e => { failed = true; console.error(e); toast('Could not load this question. Retrying…'); })
    .finally(() => setTimeout(() => { curLoading.delete(id); if (sess === s) render(); }, failed ? 2500 : 0));
}
async function loadData() {
  try {
    const [ex, us, ad] = await Promise.all([
      sb.from('exams').select('*').order('created_at'),
      sb.from('user_state').select('data').eq('user_id', me.id).maybeSingle(),
      sb.from('admins').select('user_id').maybeSingle()]);
    if (ex.error) throw ex.error;
    const rows = await fetchAll(() => sb.from('questions').select('id,exam_id,tags,difficulty'), 1000, await countQ(), 4);
    isAdmin = !!ad.data;
    catCol = ex.data.length > 0 && Object.prototype.hasOwnProperty.call(ex.data[0], 'category');
    state.exams = ex.data.map(e => ({ id: e.id, name: e.name, passMark: e.pass_mark, category: e.category || null }));
    state.bank = rows.map(stubQ);
    const saved = (us.data && us.data.data) || {}, dflt = (me.email || 'Doctor').split('@')[0];
    Object.assign(state, saved);

/* ================= spaced repetition (Anki SM-2 style) ================= */
function getCard(id) { return state.cards[id] || { ease: 2.5, interval: 0, reps: 0, lapses: 0, due: null }; }
function previewIntervals(c) {
  if (c.reps === 0) return { hard: 1, medium: 3, easy: 7 };
  const i = c.interval, hard = Math.max(1, Math.round(i * 1.2));
  const medium = Math.max(hard + 1, Math.round(i * c.ease));
  const easy = Math.max(medium + 1, Math.round(i * c.ease * 1.3));

}
function applyRating(c, rating) {
  const n = Object.assign({}, c), now = Date.now();
  if (rating === 'again') {
    if (c.reps > 0) { n.lapses = c.lapses + 1; n.ease = Math.max(1.3, c.ease - 0.2); n.interval = Math.max(1, Math.round(c.interval * 0.3)); }
    n.due = now + 10 * 60 * 1000; n.last = now; return n;
  }
  const iv = previewIntervals(c)[rating];
  if (rating === 'hard') n.ease = Math.max(1.3, c.ease - 0.15);
  if (rating === 'easy') n.ease = c.ease + 0.15;
  n.interval = iv; n.reps = c.reps + 1; n.due = now + iv * DAY; n.last = now; return n;
}

function statsOf(qs) {

    const r = state.results[q.id];
    if (r && r.attempts > 0) { att++; r.last ? cor++ : inc++; } else if (r && r.skipped > 0) skip++;
    const c = state.cards[q.id]; if (c && c.due != null && c.due <= now) due++;

  const total = qs.length, perf = att ? cor / att : 0, prog = total ? att / total : 0;
  return { total, att, cor, inc, skip, due, score: att ? Math.round(100 * perf * Math.pow(prog, 0.25)) : 0 };
}

    <label class="f" for="f-exam" style="margin-top:0">Exam</label><select class="in" id="f-exam" style="max-width:360px">${state.exams.map(e => `<option value="${e.id}" ${d.exam === e.id ? 'selected' : ''}>${esc(e.name)}</option>`).join('')}</select>
    <label class="f" for="f-stem">Question</label><textarea class="in" id="f-stem" dir="auto" rows="6" placeholder="Clinical vignette, then the question on its own line">${esc(d.stem)}</textarea>
    <label class="f">Answer choices <span class="muted" style="font-weight:400">(select the correct one; the note under each choice explains why it is right or wrong)</span></label>
    ${d.options.map((o, i) => `<div class="oe"><label class="cp"><input type="radio" name="correct" value="${i}" ${d.correct === i ? 'checked' : ''}> ${LETTERS[i]}</label>
      <div class="oe-f"><input class="in o-text" type="text" dir="auto" placeholder="Choice ${LETTERS[i]}" value="${esc(o.text)}" aria-label="Choice ${LETTERS[i]}">
      <textarea class="in o-exp" dir="auto" rows="2" placeholder="Why this choice is correct or incorrect" aria-label="Explanation for choice ${LETTERS[i]}">${esc(o.explanation)}</textarea></div>
      ${d.options.length > 2 ? `<button class="ghost" data-act="rmopt" data-i="${i}">Remove</button>` : ''}</div>`).join('')}
    ${d.options.length < 8 ? '<div style="margin-top:12px"><button class="ghost" data-act="addopt">Add choice</button></div>' : ''}
    <label class="f" for="f-exp">Explanation</label><textarea class="in" id="f-exp" dir="auto" rows="6">${esc(d.explanation)}</textarea>
    <label class="f" for="f-obj">Key facts (one line to remember)</label><input class="in" type="text" id="f-obj" dir="auto" value="${esc(d.objective)}">
    <label class="f" for="f-hint">Hint (optional)</label><input class="in" type="text" id="f-hint" dir="auto" value="${esc(d.hint)}">
    <div class="row" style="align-items:flex-start;gap:16px"><div style="flex:1;min-width:220px"><label class="f" for="f-tags">Topics (separated by commas)</label><input class="in" type="text" id="f-tags" dir="auto" value="${esc((d.tags || []).join(', '))}"></div>
    <div><label class="f" for="f-diff">Difficulty</label><select class="in" id="f-diff">${['Easy', 'Medium', 'Hard'].map(v => `<option ${d.difficulty === v ? 'selected' : ''}>${v}</option>`).join('')}</select></div></div>
    <div class="row" style="margin-top:26px"><button class="btn" data-act="saveq">Save question</button><button class="ghost" data-act="cancelq">Cancel</button></div></section>`;
}
function collectDraft() {
  const d = editing; if (!d || !$('#f-stem')) return;
  d.exam = $('#f-exam').value; d.stem = $('#f-stem').value;
  const t = [...document.querySelectorAll('.o-text')], e = [...document.querySelectorAll('.o-exp')];
  d.options = t.map((x, i) => ({ text: x.value, explanation: e[i].value }));
  const c = document.querySelector('input[name=correct]:checked'); d.correct = c ? +c.value : 0;
  d.explanation = $('#f-exp').value; d.objective = $('#f-obj').value; d.hint = $('#f-hint').value;
  d.tags = $('#f-tags').value.split(',').map(s => s.trim()).filter(Boolean); d.difficulty = $('#f-diff').value;
}
function saveQuestion() {
  collectDraft(); const d = editing;
  if (!d.stem.trim()) return toast('Write the question first.');
  const filled = d.options.filter(o => o.text.trim());
  if (filled.length < 2) return toast('Add at least two answer choices.');
  if (!d.options[d.correct].text.trim()) return toast('The correct choice cannot be empty.');
  const nc = d.options.slice(0, d.correct).filter(o => o.text.trim()).length;
  const q = { id: d.id || uid(), exam: d.exam, stem: d.stem.trim(), options: filled.map(o => ({ text: o.text.trim(), explanation: o.explanation.trim() })), correct: nc,
    explanation: d.explanation.trim(), objective: d.objective.trim(), hint: d.hint.trim(), tags: d.tags, difficulty: d.difficulty };
  const i = state.bank.findIndex(x => x.id === q.id);
  if (i >= 0) state.bank[i] = q; else state.bank.push(q);
  editing = null; saveData(); toast('Question saved'); render();
}

/* ================= import / export ================= */
function ensureExam(nameOrId, fallback) {
  if (!nameOrId) return fallback;
  let e = state.exams.find(x => x.id === nameOrId || x.name.toLowerCase() === String(nameOrId).toLowerCase());
  if (!e) { e = { id: uid(), name: String(nameOrId), passMark: 65, category: guessCat(nameOrId) }; state.exams.push(e); }
  return e.id;
}
function normQ(r, fallbackExam) {
  if (!r || typeof r.stem !== 'string' || !r.stem.trim() || !Array.isArray(r.options)) return null;
  const opts = r.options.map(o => typeof o === 'string' ? { text: o, explanation: '' } : { text: String(o.text ?? ''), explanation: String(o.explanation ?? '') });
  const c = Number.isInteger(r.correct) ? r.correct : 0;
  if (c < 0 || c >= opts.length || !opts[c].text.trim()) return null;
  const nc = opts.slice(0, c).filter(o => o.text.trim()).length, filtered = opts.filter(o => o.text.trim());
  if (filtered.length < 2) return null;
  return { id: uid(), exam: ensureExam(r.exam, fallbackExam), stem: r.stem.trim(), options: filtered.map(o => ({ text: o.text.trim(), explanation: o.explanation.trim() })), correct: nc,
    explanation: String(r.explanation || ''), objective: String(r.objective || ''), hint: String(r.hint || ''),
    tags: Array.isArray(r.tags) ? r.tags.map(String) : [], difficulty: ['Easy', 'Medium', 'Hard'].includes(r.difficulty) ? r.difficulty : 'Medium' };
}
function parseCSV(t) {
  t = t.replace(/^\uFEFF/, ''); const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(f); f = ''; if (row.some(x => x.trim())) rows.push(row); row = []; }
    else f += c;
  }
  row.push(f); if (row.some(x => x.trim())) rows.push(row); return rows;
}
function csvToQuestions(text, fb) {
  const rows = parseCSV(text); if (rows.length < 2) return [];
  const h = {}; rows[0].forEach((x, i) => h[x.trim().toLowerCase()] = i);
  const get = (r, k) => (h[k] !== undefined ? (r[h[k]] || '') : '');
  return rows.slice(1).map(r => {
    const options = [];
    for (const L of LETTERS.toLowerCase()) { if (h[L] === undefined) break; options.push({ text: get(r, L), explanation: get(r, 'exp_' + L) }); }
    const cv = get(r, 'correct').trim(); let correct = LETTERS.indexOf(cv.toUpperCase());
    if (cv.length > 1 || correct < 0) correct = (parseInt(cv) || 1) - 1;
    return normQ({ stem: get(r, 'stem') || get(r, 'question'), options, correct, explanation: get(r, 'explanation'), objective: get(r, 'objective'), hint: get(r, 'hint'), exam: get(r, 'exam'),
      tags: get(r, 'tags').split(/[;,]/).map(s => s.trim()).filter(Boolean), difficulty: get(r, 'difficulty') }, fb);
  }).filter(Boolean);
}
async function handleFile(file) {
  const text = await file.text(); const fb = manageExam !== 'all' ? manageExam : state.exams[0].id; let added = 0;
  try {
    let list = [];
    if (/\.csv$/i.test(file.name)) list = csvToQuestions(text, fb);
    else {
      const j = JSON.parse(text);
      if (!Array.isArray(j) && j.bank && j.exams) {
        if (!(await ask('This is a full backup. Replace everything currently in BoardBank with it?', 'Restore backup'))) return;
        state = Object.assign({ bank: [], results: {}, history: [], exams: [], cards: {}, marks: {}, notes: {}, daily: {}, name: state.name }, j); migrate();
        await saveData(); toast('Backup restored'); return render();
      }
      list = (Array.isArray(j) ? j : (j.bank || [])).map(r => normQ(r, fb)).filter(Boolean);
    }
    list.forEach(q => state.bank.push(q)); added = list.length;
    await saveData(); toast(added ? `${added} question${added === 1 ? '' : 's'} imported` : 'No valid questions found in the file'); render();
  } catch (e) { toast('Could not read the file. Check the format.'); }
}

/* ================= performance ================= */
function renderStats() {
  const ids = Object.keys(state.results).filter(id => byId(id) && state.results[id].attempts > 0);
  const att = ids.reduce((s, id) => s + state.results[id].attempts, 0), cor = ids.reduce((s, id) => s + state.results[id].correct, 0);
  const cards = Object.keys(state.cards).filter(id => byId(id)), dueN = duePool().length;
  const mature = cards.filter(id => state.cards[id].interval >= 21).length;
  const hist = state.history.slice(-10).reverse().map(h => `<tr><td>${new Date(h.at).toLocaleString()}</td><td>${h.kind === 'review' ? 'Review' : h.mode === 'tutor' ? 'Tutor' : 'Exam'}</td><td>${h.correct}/${h.total}</td><td>${Math.round(100 * h.correct / h.total)}%</td></tr>`).join('');
  if (!att) return `<h1 class="title">Performance</h1><div class="card empty" style="margin-top:20px"><h2 style="font:600 calc(22px * var(--fz)) var(--sans)">No results yet</h2><p style="margin:8px 0 0">Finish a session to see your performance here.</p></div>`;
  return `<h1 class="title">Performance</h1><section class="card" style="margin-top:20px"><div class="row" style="gap:44px"><div><div class="score100">${Math.round(100 * cor / att)}%</div><div class="muted">${cor} of ${att} answers correct</div></div>
    <div><div class="score100" style="font-size:calc(46px * var(--fz))">${cards.length}</div><div class="muted">in your review schedule</div></div>
    <div><div class="score100" style="font-size:calc(46px * var(--fz))">${mature}</div><div class="muted">well known (21+ day interval)</div></div>
    <div><div class="score100" style="font-size:calc(46px * var(--fz))">${dueN}</div><div class="muted">due now</div></div></div></section>
    ${hist ? `<section class="card" style="margin-top:20px"><h3 style="margin-bottom:8px">Recent sessions</h3><table><thead><tr><th>Date</th><th>Type</th><th>Score</th><th></th></tr></thead><tbody>${hist}</tbody></table></section>` : ''}`;
}

/* ================= events ================= */
document.addEventListener('click', async e => {
  if (!e.target.closest('#setpop, [data-act="settings"]')) closeSetPop();
  const t = e.target.closest('[data-act]'); if (!t) { if (sess && sess.navOpen && !e.target.closest('.navpop')) { sess.navOpen = false; render(); } return; }
  const a = t.dataset.act, i = +t.dataset.i;
  switch (a) {
    case 'settings': toggleSetPop(); break;
    case 'theme': setPref('bb_theme', t.dataset.k); renderSetPop(); break;
    case 'font': setPref('bb_font', t.dataset.k); renderSetPop(); break;
    case 'share': shareQuestion(); break;
    case 'menu': document.body.classList.toggle('menu'); break;
    case 'home': view = 'home'; render(); window.scrollTo(0, 0); break;
    case 'openexam': curExam = t.dataset.id; view = 'exam'; render(); window.scrollTo(0, 0); break;
    case 'stats': view = 'stats'; render(); break;
    case 'manage': editing = null; view = 'manage'; if (manageExam === 'all' && curExam) manageExam = curExam; render(); break;
    case 'addexam': manageTab = 'exams'; view = 'manage'; editing = null; render(); setTimeout(() => { const n = $('#newexam'); if (n) n.focus(); }, 30); break;
    case 'review': startReview(null); break;
    case 'sort': sortBy = sortBy === 'name' ? 'score' : sortBy === 'score' ? 'due' : 'name'; render(); break;
    case 'toggletopic': { const k = curExam + '|' + t.dataset.t; openTopics[k] = !openTopics[k]; render(); break; }
    case 'study': openSetup(t.dataset.t); break;
    case 'revtopic': startReview(t.dataset.t); break;
    case 'backex': view = 'exam'; render(); break;
    case 'swexam': setup.exam = !setup.exam; render(); break;
    case 'swseen': setup.seen = !setup.seen; render(); break;
    case 'start': startSession(); break;
    case 'pick': pick(i); break;
    case 'elim': { const q = cur(); const m = sess.elim[q.id] || (sess.elim[q.id] = {}); m[i] = !m[i]; if (m[i] && sess.ans[q.id] === i) delete sess.ans[q.id]; render(); break; }
    case 'optx': { const q = cur(), k = q.id + ':' + i; const good = i === q.correct, mine = i === sess.ans[q.id]; const curOpen = sess.open[k] !== undefined ? sess.open[k] : (good || mine); sess.open[k] = !curOpen; render(); break; }
    case 'submit': submitAnswer(); break;
    case 'rate': rate(t.dataset.r); break;
    case 'kf': { const q = cur(); sess.kf[q.id] = !sess.kf[q.id]; render(); break; }
    case 'navtoggle': sess.navOpen = !sess.navOpen; render(); break;
    case 'go': goTo(i); break;
    case 'prev': if (sess.idx > 0) goTo(sess.idx - 1); break;
    case 'next': if (sess.idx < sess.ids.length - 1) goTo(sess.idx + 1); break;
    case 'end': endBlock(); break;
    case 'mark': { const q = cur(); state.marks[q.id] = !state.marks[q.id]; if (!state.marks[q.id]) delete state.marks[q.id]; saveData(); render(); break; }
    case 'hint': { const q = cur(); if (!q.hint) toast('This question has no hint.'); else { sess.hint[q.id] = !sess.hint[q.id]; render(); } break; }
    case 'notefocus': { const n = $('#note'); if (n) { n.scrollIntoView({ block: 'center' }); n.focus(); } break; }
    case 'editcur': { const q = cur(); const keep = sess; editing = JSON.parse(JSON.stringify(q)); sess = null; clearInterval(timerId); view = 'manage'; manageTab = 'questions'; if (manageExam === 'all') manageExam = q.exam; toast('Session closed so you can edit.'); render(); break; }
    case 'reviewq': sess.done = false; sess.review = true; sess.idx = i; sess.visited[sess.ids[i]] = 1; view = 'session'; clearInterval(timerId); timerId = setInterval(tick, 1000); render(); window.scrollTo(0, 0); break;
    case 'leave': sess = null; view = 'home'; render(); break;
    case 'mtab': editing = null; manageTab = t.dataset.k; render(); break;
    case 'newq': if (manageExam === 'all' && curExam) manageExam = curExam; editing = blankDraft(); view = 'manage'; manageTab = 'questions'; render(); break;
    case 'editq': editing = JSON.parse(JSON.stringify(byId(t.dataset.id))); editing.hint = editing.hint || ''; render(); break;
    case 'morebank': bankLimit += 100; renderBankList(); break;
    case 'delq': if (await ask('Delete this question? This cannot be undone.', 'Delete')) {
      state.bank = state.bank.filter(q => q.id !== t.dataset.id); delete state.results[t.dataset.id]; delete state.cards[t.dataset.id]; delete state.notes[t.dataset.id]; delete state.marks[t.dataset.id];
      saveData(); render(); } break;
    case 'addopt': collectDraft(); editing.options.push({ text: '', explanation: '' }); render(); break;
    case 'rmopt': collectDraft(); editing.options.splice(i, 1); if (editing.correct === i) editing.correct = 0; else if (editing.correct > i) editing.correct--; render(); break;
    case 'saveq': saveQuestion(); break;
    case 'cancelq': editing = null; render(); break;
    case 'doaddexam': { const n = $('#newexam').value.trim(); if (!n) return toast('Write a name for the exam.'); state.exams.push({ id: uid(), name: n, passMark: 65, category: guessCat(n) }); saveData(); render(); break; }
    case 'delexam': { const ex = examById(t.dataset.id), n = examQs(ex.id).length;
      if (await ask(`Delete "${ex.name}"${n ? ' and its ' + n + ' question' + (n === 1 ? '' : 's') : ''}? This cannot be undone.`, 'Delete')) {
        state.bank.filter(q => q.exam === ex.id).forEach(q => { if (q.stub) orphanDel.add(q.id); delete state.results[q.id]; delete state.cards[q.id]; });
        state.bank = state.bank.filter(q => q.exam !== ex.id); state.exams = state.exams.filter(x => x.id !== ex.id); if (manageExam === ex.id) manageExam = 'all'; saveData(); render(); } break; }
    case 'import': $('#file').click(); break;
    case 'export': { busy(true); try { await hydrateAll(); } catch (e) { busy(false); toast('Could not load all the questions for the backup.'); break; } busy(false); download('qbank-backup.json', JSON.stringify({ version: 2, name: state.name, exams: state.exams, bank: state.bank, results: state.results, cards: state.cards, marks: state.marks, notes: state.notes, daily: state.daily, history: state.history }, null, 2), 'application/json'); break; }
    case 'csvtpl': download('qbank-template.csv', 'exam,stem,a,b,c,d,e,correct,explanation,objective,hint,tags,difficulty,exp_a,exp_b,exp_c,exp_d,exp_e\n"Internal Medicine","Which vitamin deficiency causes scurvy?","Vitamin A","Vitamin B12","Vitamin C","Vitamin D","Vitamin K",C,"Vitamin C is needed for collagen synthesis.","Scurvy = vitamin C deficiency","Think about citrus and sailors","Nutrition;Basics",Easy,"","","Correct.","",""\n', 'text/csv'); break;
    case 'rename': { const n = prompt('Your name', state.name); if (n && n.trim()) { state.name = n.trim(); saveData(); render(); } break; }
    case 'logout': await sb.auth.signOut(); location.reload(); break;
    case 'reset': if (await ask('Delete all results, notes, bookmarks and review schedules? Your questions are kept.', 'Reset')) { state.results = {}; state.history = []; state.cards = {}; state.notes = {}; state.marks = {}; state.daily = {}; saveData(); render(); } break;
  }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'bq') { bankQuery = e.target.value; bankLimit = 50; clearTimeout(bankTimer); bankTimer = setTimeout(bankSearch, 350); }
  else if (id === 's-count') setup.count = e.target.value;
  else if (id === 's-h') setup.h = e.target.value;
  else if (id === 's-m') setup.m = e.target.value;
  else if (id === 'note' && sess) { const q = cur(); if (e.target.value.trim()) state.notes[q.id] = e.target.value; else delete state.notes[q.id]; saveSoon(); }
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 's-filter') { setup.filter = e.target.value; render(); }
  else if (id === 'mexam') { manageExam = e.target.value; bankLimit = 50; bankHits = null; render(); }
  else if (id === 'nm') { state.name = e.target.value.trim() || 'Doctor'; saveData(); renderSide(); }
  else if (id === 'file' && e.target.files[0]) { handleFile(e.target.files[0]); e.target.value = ''; }
  else if (e.target.classList.contains('ex-cat')) { const ex = examById(e.target.closest('[data-eid]').dataset.eid); ex.category = e.target.value; saveData(); render(); }
  else if (e.target.classList.contains('ex-name')) {
    const row = e.target.closest('[data-eid]'), ex = examById(row.dataset.eid);
    ex.name = row.querySelector('.ex-name').value.trim() || ex.name; saveData(); renderSide();
  }
});
document.addEventListener('keydown', e => {
  const tg = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && tg.dataset && tg.dataset.act && tg.tagName !== 'BUTTON') { e.preventDefault(); tg.click(); return; }
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(tg.tagName) || view !== 'session' || !sess || sess.done) return;
  const q = cur(); if (!q) return;
  const rev = revealed(q);
  if (rev && ['1', '2', '3'].includes(e.key)) { rate(['hard', 'medium', 'easy'][+e.key - 1]); return; }
  const k = e.key.toUpperCase(), i = LETTERS.indexOf(k);
  if (!rev && k.length === 1 && i >= 0 && i < q.options.length && !e.ctrlKey && !e.metaKey) pick(i);
  else if (e.key === 'ArrowRight' && sess.idx < sess.ids.length - 1) goTo(sess.idx + 1);
  else if (e.key === 'ArrowLeft' && sess.idx > 0) goTo(sess.idx - 1);
  else if (e.key === 'Enter' && tg.tagName !== 'BUTTON') {
    if (!rev && sess.mode === 'tutor' && sess.ans[q.id] !== undefined) submitAnswer();
    else if (sess.idx < sess.ids.length - 1) goTo(sess.idx + 1);
  }
});

/* ================= boot ================= */
async function start(session) {
  me = session.user;
  const ok = await loadData(); migrate();
  if (!ok) { $('#au-m').textContent = 'Could not load your data' + (loadErr ? ' (' + loadErr + ')' : '') + '. Reload to try again.'; return; }
  $('#auth').hidden = true; curExam = state.exams[0].id; view = 'home';
  if (!state.named) {
    const m = me.user_metadata && me.user_metadata.name;
    if (m) { state.name = m; state.named = true; saveData(); }
    else { $('#namebox').hidden = false; $('#nb-n').value = state.name === (me.email || '').split('@')[0] ? '' : state.name; $('#nb-n').focus(); }
  }
  render();
}
$('#nbf').addEventListener('submit', e => {
  e.preventDefault(); const n = $('#nb-n').value.trim(); if (!n) return;
  state.name = n; state.named = true; $('#namebox').hidden = true; saveData(); render();
});
let signup = false;
const amsg = t => { $('#au-m').textContent = t; };
function setMode(on) {
  signup = on; $('#au-t').textContent = on ? 'Create your account' : 'Sign in'; $('#au-go').textContent = on ? 'Create account' : 'Sign in';
  $('#au-nw').hidden = !on; $('#au-q').textContent = on ? 'Already have an account?' : 'New here?'; $('#au-sw').textContent = on ? 'Sign in' : 'Create an account';
  $('#au-p').autocomplete = on ? 'new-password' : 'current-password'; amsg('');
}
$('#au-sw').addEventListener('click', e => { e.preventDefault(); setMode(!signup); });
$('#authf').addEventListener('submit', async e => {
  e.preventDefault(); const email = $('#au-e').value.trim(), password = $('#au-p').value;
  if (signup) {
    const name = $('#au-n').value.trim();
    if (!name) return amsg('Write your name.'); if (password.length < 6) return amsg('Password must be at least 6 characters.');
    amsg('Creating account…');
    const r = await sb.auth.signUp({ email, password, options: { data: { name }, emailRedirectTo: location.origin + location.pathname } });
    if (r.error) return amsg(r.error.message);
    if (r.data.session) start(r.data.session); else { setMode(false); amsg('Account created. Confirm your email, then sign in.'); }
  } else {
    amsg('Signing in…');
    const r = await sb.auth.signInWithPassword({ email, password });
    if (r.error) return amsg(r.error.message); start(r.data.session);
  }
});
(async function () {
  const { data } = await sb.auth.getSession();
  if (data.session) start(data.session);
})();
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSetPop(); });
