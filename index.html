<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>BoardBank</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141414; --mute:#6b6b6b; --line:#e6e6e6; --bg:#fafafa; --card:#fff;
  --blue:#5b8def; --green:#63c97a; --green-d:#2e7d4f; --green-bg:#e7f5ea;
  --red:#d6453d; --red-bg:#fcebea; --amber:#f2b84b; --amber-bg:#fff4d6;
  --sans:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --hand:"Segoe Print","Bradley Hand","Chalkboard SE","Comic Neue","Comic Sans MS",cursive;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.ic{flex:none;vertical-align:middle}
h1,h2,h3,h4,p{margin:0}
.muted{color:var(--mute)} .sm{font-size:13px}

/* shell */
#shell{display:flex;min-height:100vh}
#side{width:270px;flex:none;background:#fff;border-right:1px solid var(--line);padding:26px 18px;position:sticky;top:0;height:100vh;overflow:auto}
#content{flex:1;min-width:0;background-color:var(--bg);background-image:radial-gradient(#dcdcdc 1px,transparent 1px);background-size:22px 22px}
body.insess #side{display:none}
.brand{font:800 32px/1 "Plus Jakarta Sans",var(--sans);letter-spacing:-1px;color:var(--ink)}
.brand b{font-weight:800;color:var(--green-d)}
.brand-c{text-align:center;padding:4px 0 26px}
.card-brand{text-align:center;font-size:38px;margin:6px 0 4px}
.hi{font:700 22px var(--hand);margin:18px 0 26px}
.lbl{font:15px var(--hand);color:var(--mute);margin:18px 8px 6px}
.nav{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-radius:12px;padding:11px 12px;text-align:left;font-size:15px;color:#333}
.nav:hover{background:#f3f3f3}
.nav.on{background:#f0f0f0;font-weight:700;color:var(--ink)}
.nav span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dueb{font-style:normal;background:var(--amber);color:#3d2c00;border-radius:99px;font-size:12px;font-weight:700;padding:1px 8px}
hr{border:0;border-top:1px solid var(--line);margin:14px 6px}
#mbar{display:none}
main{max-width:1080px;margin:0 auto;padding:34px 28px 120px}
body.insess main{max-width:1240px;padding-top:0}

/* buttons */
.btn{background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:14px;padding:11px 22px;font-weight:600}
.btn:hover{background:#2b2b2b}
.btn:disabled{background:#dedede;border-color:#dedede;color:#9a9a9a;cursor:not-allowed}
.ghost{background:#fff;border:1px solid var(--ink);border-radius:14px;padding:10px 18px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.ghost:hover{background:#f3f3f3}
.ghost:disabled{border-color:var(--line);color:#aaa;cursor:not-allowed;background:#f4f4f4}
.ghost.danger{color:var(--red);border-color:var(--red)}
.sq{width:42px;height:42px;border-radius:12px;border:1px solid var(--ink);background:#fff;display:grid;place-items:center;padding:0}
.sq:disabled{background:#e3e3e3;border-color:#d0d0d0;color:#aaa}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:28px}
.crumb{display:flex;align-items:center;gap:14px;margin-bottom:26px;font-size:15px;flex-wrap:wrap}
.crumb .sep{color:#aaa}
.crumb a{color:var(--mute);cursor:pointer;background:none;border:0;padding:0}
.crumb b{font-weight:600}

/* home */
.hero{display:grid;grid-template-columns:1fr 250px;gap:20px;align-items:center;overflow:hidden}
.hero h1{font:700 40px/1.1 var(--sans);margin:6px 0 6px}
.big{font:700 64px/1 var(--sans)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.fc{display:flex;gap:10px;align-items:flex-end;height:120px;margin-top:14px}
.fc div{flex:1;text-align:center;font-size:12px;color:var(--mute);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.fc i{display:block;background:var(--blue);border-radius:8px 8px 3px 3px;min-height:4px;margin-bottom:6px}
.fc div.today i{background:var(--amber)}
.fc b{color:var(--ink);font-size:13px}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;margin-top:14px}
.heat i{aspect-ratio:1;border-radius:6px;background:#eee}
.heat i.l1{background:#cfe9d6}.heat i.l2{background:#97d6a8}.heat i.l3{background:#4fb56b}
.heat i.now{outline:2px solid var(--ink);outline-offset:1px}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:14px}
.excard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;text-align:left;display:block;width:100%}
.excard:hover{border-color:var(--ink)}
.excard h3{font-size:18px;margin:8px 0 2px}
h2.sec{font:700 22px var(--sans);margin:34px 0 0}

/* curriculum */
.title{font:700 40px/1.1 var(--sans)}
.passrow{display:flex;align-items:center;justify-content:space-between;margin:14px 0 28px;gap:14px;flex-wrap:wrap}
.pass{display:flex;align-items:center;gap:12px}
.pass span.k{font:16px var(--hand);color:var(--mute)}
.pass input{width:72px;border:0;border-left:1px solid var(--ink);padding:2px 0 2px 12px;font:700 28px var(--sans);background:transparent}
.topic{background:#fff;border:1px solid var(--line);border-radius:18px;margin-bottom:14px}
.trow{display:grid;grid-template-columns:minmax(120px,1.1fr) 2fr 70px;gap:20px;align-items:center;width:100%;background:none;border:0;padding:20px 26px;text-align:left}
.tn{font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slider{position:relative;height:14px;background:#cfcfcf;border-radius:99px}
.slider .fill{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:99px}
.slider .knob{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#fff;border:6px solid var(--blue)}
.slider .pass{position:absolute;top:-8px;bottom:-8px;border-left:2px dashed var(--ink)}
.tscore{font:700 34px var(--sans);text-align:right}
.tbody{padding:0 26px 26px}
.stats{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--line);border-radius:22px;padding:22px 8px}
.stats div{padding:0 16px;border-left:1px solid var(--line)}
.stats div:first-child{border-left:0}
.stats b{display:block;font-size:15px;font-weight:600}
.stats span{font:700 22px var(--sans)}
.stats i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.formula{margin:18px 0;color:var(--mute);font-size:14px}
.formula code{display:block;margin-top:12px;background:#f4f4f4;border:1px solid var(--line);border-radius:18px;padding:14px 18px;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace}

/* setup */
.setup{max-width:780px;margin:0 auto}
.setup .head{padding:26px 30px;border-bottom:1px solid var(--line)}
.setup .head h2{font:700 24px var(--sans)}
.setup .sec{padding:26px 30px;border-bottom:1px solid var(--line)}
.setup .sec:last-child{border-bottom:0}
.setup h3{font-size:19px}
.setup input[type=number],.setup select{width:100%;border:1px solid var(--line);border-radius:26px;padding:15px 20px;background:#fff;margin-top:14px;font-size:16px}
.tm{display:flex;gap:10px;align-items:center;margin-top:10px}
.tm input{width:84px!important;text-align:center;margin:0!important;padding:10px!important;border-radius:14px!important}
.switch{width:50px;height:28px;border-radius:99px;border:0;background:#d9d9d9;position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.switch.on{background:var(--ink)}
.switch.on::after{left:25px}
.sbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:16px 28px;display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap;z-index:6}
body:not(.insess) .sbar{left:270px}
.sbar .l{display:flex;align-items:center;gap:12px}

/* session */
.stop{position:sticky;top:0;z-index:7;background:#fff;border-bottom:1px solid var(--line);margin:0 -28px 24px;padding:12px 28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qsel{background:none;border:0;font:500 26px var(--sans);display:flex;align-items:center;gap:6px;padding:0 8px 0 0;color:#444}
.stop .timer{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--mute);font-weight:600}
.stop .timer.low{color:var(--red)}
.navpop{position:absolute;top:100%;left:20px;margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 12px 32px rgba(0,0,0,.12);display:grid;grid-template-columns:repeat(8,40px);gap:6px;max-height:60vh;overflow:auto}
.cell{position:relative;width:40px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;padding:0}
.cell.cur{border-color:var(--ink);border-width:2px}
.cell.ans{background:#e9f0fd}
.cell.ok{background:var(--green-bg);border-color:var(--green)}
.cell.no{background:var(--red-bg);border-color:var(--red)}
.cell.fl::after{content:"";position:absolute;top:-1px;right:-1px;border:6px solid transparent;border-top-color:var(--amber);border-right-color:var(--amber)}
.slay{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
.qcard{background:#fff;border:1px solid var(--line);border-radius:30px;padding:36px 38px}
.vig{font-size:18px;color:#4a4a4a;white-space:pre-wrap;margin-bottom:18px;line-height:1.65}
.qq{font-size:19px;font-weight:700;white-space:pre-wrap;margin-bottom:28px;line-height:1.5}
.opt{display:flex;align-items:center;gap:16px;border:1px solid var(--line);background:#f9f9f9;border-radius:30px;padding:20px 26px;margin-bottom:14px;cursor:pointer;font-size:17px;font-weight:500}
.opt:hover{border-color:#999}
.radio{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid #bdbdbd;background:#fff}
.opt.sel{border-color:var(--ink);background:#fff}
.opt.sel .radio{border:8px solid var(--ink)}
.opt .txt{flex:1;white-space:pre-wrap}
.opt.elim .txt{text-decoration:line-through;color:#999}
.opt .x{font-size:12px;color:var(--mute);padding:4px 8px;border-radius:8px;border:1px solid transparent}
.opt .x:hover{border-color:var(--line);background:#fff}
.submit{width:100%;border:0;border-radius:14px;padding:20px;font-size:18px;font-weight:600;background:var(--ink);color:#fff;margin-top:14px}
.submit:disabled{background:#dedede;color:#999;cursor:not-allowed}
.ocard{border:1px solid var(--line);border-radius:30px;padding:22px 28px;margin-bottom:14px;background:#f9f9f9}
.ocard.good{background:var(--green-bg);border-color:var(--green)}
.ocard.bad{background:var(--red-bg);border-color:var(--red)}
.ohead{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:600}
.ohead .t{flex:1;white-space:pre-wrap}
.ocard.good .ic:first-child{color:var(--green-d)} .ocard.bad .ic:first-child{color:var(--red)}
.tagc{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:#fff}
.oexp{margin:14px 0 0 4px;padding:4px 0 4px 20px;border-left:3px solid rgba(0,0,0,.15);white-space:pre-wrap;color:#333}
.showexp{display:block;width:100%;margin-top:14px;background:rgba(255,255,255,.7);border:0;border-radius:12px;padding:14px;font-weight:600}
.showexp:hover{background:#fff}
.kf{border:1px solid var(--line);border-radius:30px;padding:28px 32px;margin:22px 0;background:#fff}
.kf h3{display:flex;align-items:center;gap:12px;font-size:21px;margin-bottom:12px}
.kf h4{font-size:17px;margin:16px 0 8px}
.kf .body{white-space:pre-wrap;color:#3a3a3a}
.kf .clamp{max-height:230px;overflow:hidden;position:relative}
.kf .clamp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(transparent,#fff)}
.kf .more{background:none;border:0;font-weight:700;font-size:17px;margin-top:10px;display:flex;align-items:center;gap:6px;padding:0}
.keyline{background:var(--amber-bg);border-radius:14px;padding:12px 16px;margin:6px 0 4px}
.rate{border:2px solid var(--ink);border-radius:30px;padding:24px 28px;margin:22px 0;background:#fff}
.rate h3{font-size:19px}
.rbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.rb{border:2px solid var(--line);border-radius:18px;padding:14px 8px;background:#fff;text-align:center}
.rb b{display:block;font-size:17px}
.rb span{font-size:13px;color:var(--mute)}
.rb.hard{background:#fdeceb} .rb.medium{background:var(--amber-bg)} .rb.easy{background:var(--green-bg)}
.rb:hover{border-color:var(--ink)}
.rb.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.again{background:var(--red-bg);border-radius:18px;padding:14px 18px;margin-top:14px}
.hint{background:var(--amber-bg);border-radius:18px;padding:14px 18px;margin-bottom:18px}
.next{display:flex;justify-content:space-between;gap:10px;margin-top:8px}
.side .box{background:#fff;border:1px solid var(--line);border-radius:30px;padding:26px 28px;margin-bottom:16px}
.side{position:sticky;top:84px}
.score{display:flex;justify-content:space-between;align-items:baseline}
.score h3{font-size:20px}
.score b{font:700 44px var(--sans);border-bottom:1px dashed #bbb}
.bar{height:14px;border-radius:99px;background:#e3e3e3;margin:16px 0 20px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.leg{display:flex;align-items:center;gap:10px;margin:8px 0;color:#444}
.leg i{width:12px;height:12px;border-radius:50%}
.leg b{margin-left:auto;font-weight:600;color:var(--ink)}
.notes textarea{width:100%;border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-height:110px;resize:vertical;background:#fcfcfc;margin-top:10px}
.fab{position:fixed;right:26px;bottom:26px;background:#fff;border:1px solid var(--line);border-radius:30px;padding:10px 14px;display:flex;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.1);z-index:8}
.fab button{width:46px;height:46px;border-radius:50%;border:1px solid #cfcfcf;background:#fff;display:grid;place-items:center;padding:0}
.fab button.on{background:var(--amber);border-color:var(--amber)}
.fab button:hover{border-color:var(--ink)}

/* tables, manage */
.score100{font:700 70px/1 var(--sans)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:600}
.pill{font-weight:700;font-size:12px;padding:2px 10px;border-radius:99px}
.pill.ok{background:var(--green-bg);color:var(--green-d)} .pill.no{background:var(--red-bg);color:var(--red)} .pill.na{background:var(--amber-bg);color:#8a5a00}
.tabs{display:flex;gap:6px;margin:18px 0}
.tab{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 18px;font-weight:600}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
label.f{display:block;font-weight:600;font-size:14px;margin:18px 0 6px}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px 14px;background:#fff}
textarea.in{resize:vertical}
.chip{display:inline-block;background:#f0f0f0;border-radius:99px;padding:2px 10px;font-size:12px;margin:0 5px 4px 0}
.qrow{display:flex;gap:14px;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qrow .s{flex:1;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.oe{display:flex;gap:12px;align-items:flex-start;margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:18px}
.oe .cp{display:flex;gap:6px;align-items:center;padding-top:10px;white-space:nowrap;font-weight:700}
.oe-f{flex:1;display:grid;gap:8px}
.empty{text-align:center;padding:44px 12px;color:var(--mute)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:14px;z-index:40}
.ov{position:fixed;inset:0;background:rgba(20,20,20,.45);display:grid;place-items:center;z-index:50;padding:16px}
.ov .box{background:#fff;border-radius:22px;padding:26px;max-width:420px;width:100%}
.note{background:var(--amber-bg);border:1px solid #ecd9a6;border-radius:14px;padding:10px 14px;font-size:13px;margin-bottom:16px}

@media (max-width:960px){
  #side{position:fixed;left:0;top:0;z-index:30;transform:translateX(-102%);transition:transform .2s;width:285px;box-shadow:0 0 40px rgba(0,0,0,.2)}
  body.menu #side{transform:none}
  #mbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  body.insess #mbar{display:none}
  body:not(.insess) .sbar{left:0}
  .slay{grid-template-columns:1fr}
  .side{position:static}
  .hero{grid-template-columns:1fr} .hero svg{display:none}
  .grid2{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(3,1fr);row-gap:18px}
  .stats div:nth-child(4){border-left:0}
  .trow{grid-template-columns:1fr 60px;row-gap:14px}
  .trow .slider{grid-column:1/-1;grid-row:2}
  main{padding:22px 16px 120px}
  .stop{margin:0 -16px 20px;padding:10px 16px}
  .qcard{padding:24px 20px;border-radius:24px}
  .navpop{grid-template-columns:repeat(6,40px)}
  .title,.hero h1{font-size:32px}
}
@media (max-width:960px){.brand-c{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#auth,#namebox{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:20px}#auth[hidden],#namebox[hidden],#au-nw[hidden]{display:none}
</style>
</head>
<body>
<div id="shell">
  <aside id="side" aria-label="Main navigation"></aside>
  <div id="content">
    <div id="mbar"><button class="sq" data-act="menu" aria-label="Menu" id="menubtn"></button><span class="brand" style="font-size:24px">Board<b>Bank</b></span></div>
    <main id="app"></main>
  </div>
</div>
<div id="fabslot"></div>
<div id="auth"><div class="card" style="max-width:380px;width:100%"><div class="brand card-brand">Board<b>Bank</b></div>
<h2 id="au-t" style="font:700 20px var(--sans);margin-top:14px;text-align:center">Sign in</h2>
<form id="authf"><div id="au-nw" hidden><label class="f" for="au-n">Your name</label><input class="in" id="au-n" type="text" autocomplete="name"></div>
<label class="f" for="au-e">Email</label><input class="in" id="au-e" type="email" autocomplete="email" required>
<label class="f" for="au-p">Password</label><input class="in" id="au-p" type="password" autocomplete="current-password" minlength="6" required>
<button class="btn" type="submit" id="au-go" style="width:100%;margin-top:22px">Sign in</button>
<p class="muted sm" id="au-m" style="margin-top:14px;min-height:1.4em"></p>
<p class="sm" style="margin-top:6px"><span class="muted" id="au-q">New here?</span> <a href="#" id="au-sw" style="color:var(--ink);font-weight:700">Create an account</a></p></form></div></div>
<div id="namebox" hidden><div class="card" style="max-width:380px;width:100%"><div class="brand card-brand">Board<b>Bank</b></div>
<h2 style="font:700 20px var(--sans);margin-top:14px;text-align:center">What should we call you?</h2>
<form id="nbf"><label class="f" for="nb-n">Your name</label><input class="in" id="nb-n" type="text" autocomplete="name" required>
<button class="btn" type="submit" style="width:100%;margin-top:22px">Continue</button></form></div></div>
<input type="file" id="file" accept=".json,.csv,text/csv,application/json" hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ================= helpers ================= */
const $ = s => document.querySelector(s);

    for (;;) {
      const r = await sb.from('questions').select('*').order('created_at').range(from, from + 999);

async function syncContent() {
  const ce = state.exams.map(eRow), cq = state.bank.map(qRow);
  const ids = new Set(ce.map(r => r.id)), qids = new Set(cq.map(r => r.id));
  const ue = ce.filter(r => synced.e.get(r.id) !== JSON.stringify(r)), uq = cq.filter(r => synced.q.get(r.id) !== JSON.stringify(r));
  const de = [...synced.e.keys()].filter(id => !ids.has(id)), dq = [...synced.q.keys()].filter(id => !qids.has(id));
  if (ue.length) { const r = await sb.from('exams').upsert(ue); if (r.error) throw r.error; }
  for (let i = 0; i < uq.length; i += 100) { const r = await sb.from('questions').upsert(uq.slice(i, i + 100)); if (r.error) throw r.error; }
  for (let i = 0; i < dq.length; i += 100) { const r = await sb.from('questions').delete().in('id', dq.slice(i, i + 100)); if (r.error) throw r.error; }
  if (de.length) { const r = await sb.from('exams').delete().in('id', de); if (r.error) throw r.error; }
  synced = { e: mapSnap(ce), q: mapSnap(cq) };
}

function fmtIv(days) {
  if (days < 1) return Math.round(days * 1440) + ' min';

  if (days < 365) { const m = Math.round(days / 30 * 10) / 10; return m + ' months'; }

function splitStem(s) {
  s = s.trim(); const paras = s.split(/\n\s*\n/);
  if (paras.length > 1) return { v: paras.slice(0, -1).join('\n\n'), q: paras[paras.length - 1] };
  const m = s.match(/^([\s\S]*?[.!:]\s+)([^.!:]*\?)\s*$/);
  return m ? { v: m[1].trim(), q: m[2].trim() } : { v: '', q: s };
}

/* ================= spaced repetition (Anki SM-2 style) ================= */
function getCard(id) { return state.cards[id] || { ease: 2.5, interval: 0, reps: 0, lapses: 0, due: null }; }
function previewIntervals(c) {
  if (c.reps === 0) return { hard: 1, medium: 3, easy: 7 };
  const i = c.interval, hard = Math.max(1, Math.round(i * 1.2));
  const medium = Math.max(hard + 1, Math.round(i * c.ease));
  const easy = Math.max(medium + 1, Math.round(i * c.ease * 1.3));
  return { hard, medium, easy };
}
function applyRating(c, rating) {
  const n = Object.assign({}, c), now = Date.now();
  if (rating === 'again') {
    if (c.reps > 0) { n.lapses = c.lapses + 1; n.ease = Math.max(1.3, c.ease - 0.2); n.interval = Math.max(1, Math.round(c.interval * 0.3)); }
    n.due = now + 10 * 60 * 1000; n.last = now; return n;
  }
  const iv = previewIntervals(c)[rating];
  if (rating === 'hard') n.ease = Math.max(1.3, c.ease - 0.15);
  if (rating === 'easy') n.ease = c.ease + 0.15;
  n.interval = iv; n.reps = c.reps + 1; n.due = now + iv * DAY; n.last = now; return n;
}
const isDue = id => { const c = state.cards[id]; return !!(c && c.due != null && c.due <= Date.now()); };
function duePool(examId, topic) {
  return state.bank.filter(q => (!examId || q.exam === examId) && (!topic || qTags(q).includes(topic)) && isDue(q.id))
    .sort((a, b) => state.cards[a.id].due - state.cards[b.id].due);
}

/* ================= stats ================= */
function statsOf(qs) {
  const now = Date.now(); let att = 0, cor = 0, inc = 0, skip = 0, due = 0;
  qs.forEach(q => {
    const r = state.results[q.id];
    if (r && r.attempts > 0) { att++; r.last ? cor++ : inc++; } else if (r && r.skipped > 0) skip++;
    const c = state.cards[q.id]; if (c && c.due != null && c.due <= now) due++;
  });
  const total = qs.length, perf = att ? cor / att : 0, prog = total ? att / total : 0;
  return { total, att, cor, inc, skip, due, score: att ? Math.round(100 * perf * Math.pow(prog, 0.25)) : 0 };
}
const examQs = id => state.bank.filter(q => q.exam === id);
function topicsOf(id) { const m = {}; examQs(id).forEach(q => qTags(q).forEach(t => (m[t] = m[t] || []).push(q))); return m; }

  names.sort((a, b) => sortBy === 'score' ? stat[a].score - stat[b].score : sortBy === 'due' ? stat[b].due - stat[a].due : a.localeCompare(b));

  const list = state.bank.filter(x => (manageExam === 'all' || x.exam === manageExam) && (!q || x.stem.toLowerCase().includes(q) || (x.tags || []).some(t => t.toLowerCase().includes(q))));
  el.innerHTML = list.length ? list.map(x => { const r = state.results[x.id], e = examById(x.exam);
    return `<div class="qrow"><div class="s" dir="auto"><div>${esc(x.stem.length > 150 ? x.stem.slice(0, 150) + '…' : x.stem)}</div>
      <div style="margin-top:6px"><span class="chip" style="background:#e9f0fd">${esc(e ? e.name : '')}</span>${(x.tags || []).map(t => `<span class="chip">${esc(t)}</span>`).join('')}<span class="muted sm">${x.options.length} choices${r && r.attempts ? ' · ' + r.correct + '/' + r.attempts + ' correct' : ''}</span></div></div>
      <div class="row" style="align-items:flex-start"><button class="ghost" data-act="editq" data-id="${x.id}">Edit</button><button class="ghost danger" data-act="delq" data-id="${x.id}">Delete</button></div></div>`; }).join('')
    : `<div class="empty">${state.bank.length ? 'No questions match your search.' : 'No questions yet. Select Add question to create one.'}</div>`;
}
function renderEditor() {
  const d = editing;
  return `<h1 class="title" style="margin-bottom:18px">${d.id ? 'Edit question' : 'New question'}</h1><section class="card">
    <label class="f" for="f-exam" style="margin-top:0">Exam</label><select class="in" id="f-exam" style="max-width:360px">${state.exams.map(e => `<option value="${e.id}" ${d.exam === e.id ? 'selected' : ''}>${esc(e.name)}</option>`).join('')}</select>
    <label class="f" for="f-stem">Question</label><textarea class="in" id="f-stem" dir="auto" rows="6" placeholder="Clinical vignette, then the question on its own line">${esc(d.stem)}</textarea>
    <label class="f">Answer choices <span class="muted" style="font-weight:400">(select the correct one; the note under each choice explains why it is right or wrong)</span></label>
    ${d.options.map((o, i) => `<div class="oe"><label class="cp"><input type="radio" name="correct" value="${i}" ${d.correct === i ? 'checked' : ''}> ${LETTERS[i]}</label>
      <div class="oe-f"><input class="in o-text" type="text" dir="auto" placeholder="Choice ${LETTERS[i]}" value="${esc(o.text)}" aria-label="Choice ${LETTERS[i]}">
      <textarea class="in o-exp" dir="auto" rows="2" placeholder="Why this choice is correct or incorrect" aria-label="Explanation for choice ${LETTERS[i]}">${esc(o.explanation)}</textarea></div>
      ${d.options.length > 2 ? `<button class="ghost" data-act="rmopt" data-i="${i}">Remove</button>` : ''}</div>`).join('')}
    ${d.options.length < 8 ? '<div style="margin-top:12px"><button class="ghost" data-act="addopt">Add choice</button></div>' : ''}
    <label class="f" for="f-exp">Explanation</label><textarea class="in" id="f-exp" dir="auto" rows="6">${esc(d.explanation)}</textarea>
    <label class="f" for="f-obj">Key facts (one line to remember)</label><input class="in" type="text" id="f-obj" dir="auto" value="${esc(d.objective)}">
    <label class="f" for="f-hint">Hint (optional)</label><input class="in" type="text" id="f-hint" dir="auto" value="${esc(d.hint)}">
    <div class="row" style="align-items:flex-start;gap:16px"><div style="flex:1;min-width:220px"><label class="f" for="f-tags">Topics (separated by commas)</label><input class="in" type="text" id="f-tags" dir="auto" value="${esc((d.tags || []).join(', '))}"></div>
    <div><label class="f" for="f-diff">Difficulty</label><select class="in" id="f-diff">${['Easy', 'Medium', 'Hard'].map(v => `<option ${d.difficulty === v ? 'selected' : ''}>${v}</option>`).join('')}</select></div></div>
    <div class="row" style="margin-top:26px"><button class="btn" data-act="saveq">Save question</button><button class="ghost" data-act="cancelq">Cancel</button></div></section>`;
}
function collectDraft() {
  const d = editing; if (!d || !$('#f-stem')) return;
  d.exam = $('#f-exam').value; d.stem = $('#f-stem').value;
  const t = [...document.querySelectorAll('.o-text')], e = [...document.querySelectorAll('.o-exp')];
  d.options = t.map((x, i) => ({ text: x.value, explanation: e[i].value }));
  const c = document.querySelector('input[name=correct]:checked'); d.correct = c ? +c.value : 0;
  d.explanation = $('#f-exp').value; d.objective = $('#f-obj').value; d.hint = $('#f-hint').value;
  d.tags = $('#f-tags').value.split(',').map(s => s.trim()).filter(Boolean); d.difficulty = $('#f-diff').value;
}
function saveQuestion() {
  collectDraft(); const d = editing;
  if (!d.stem.trim()) return toast('Write the question first.');
  const filled = d.options.filter(o => o.text.trim());
  if (filled.length < 2) return toast('Add at least two answer choices.');
  if (!d.options[d.correct].text.trim()) return toast('The correct choice cannot be empty.');
  const nc = d.options.slice(0, d.correct).filter(o => o.text.trim()).length;
  const q = { id: d.id || uid(), exam: d.exam, stem: d.stem.trim(), options: filled.map(o => ({ text: o.text.trim(), explanation: o.explanation.trim() })), correct: nc,
    explanation: d.explanation.trim(), objective: d.objective.trim(), hint: d.hint.trim(), tags: d.tags, difficulty: d.difficulty };
  const i = state.bank.findIndex(x => x.id === q.id);
  if (i >= 0) state.bank[i] = q; else state.bank.push(q);
  editing = null; saveData(); toast('Question saved'); render();
}

/* ================= import / export ================= */
function ensureExam(nameOrId, fallback) {
  if (!nameOrId) return fallback;
  let e = state.exams.find(x => x.id === nameOrId || x.name.toLowerCase() === String(nameOrId).toLowerCase());
  if (!e) { e = { id: uid(), name: String(nameOrId), passMark: 65 }; state.exams.push(e); }
  return e.id;
}
function normQ(r, fallbackExam) {
  if (!r || typeof r.stem !== 'string' || !r.stem.trim() || !Array.isArray(r.options)) return null;
  const opts = r.options.map(o => typeof o === 'string' ? { text: o, explanation: '' } : { text: String(o.text ?? ''), explanation: String(o.explanation ?? '') });
  const c = Number.isInteger(r.correct) ? r.correct : 0;
  if (c < 0 || c >= opts.length || !opts[c].text.trim()) return null;
  const nc = opts.slice(0, c).filter(o => o.text.trim()).length, filtered = opts.filter(o => o.text.trim());
  if (filtered.length < 2) return null;
  return { id: uid(), exam: ensureExam(r.exam, fallbackExam), stem: r.stem.trim(), options: filtered.map(o => ({ text: o.text.trim(), explanation: o.explanation.trim() })), correct: nc,
    explanation: String(r.explanation || ''), objective: String(r.objective || ''), hint: String(r.hint || ''),
    tags: Array.isArray(r.tags) ? r.tags.map(String) : [], difficulty: ['Easy', 'Medium', 'Hard'].includes(r.difficulty) ? r.difficulty : 'Medium' };
}
function parseCSV(t) {
  t = t.replace(/^\uFEFF/, ''); const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(f); f = ''; if (row.some(x => x.trim())) rows.push(row); row = []; }
    else f += c;
  }
  row.push(f); if (row.some(x => x.trim())) rows.push(row); return rows;
}
function csvToQuestions(text, fb) {
  const rows = parseCSV(text); if (rows.length < 2) return [];
  const h = {}; rows[0].forEach((x, i) => h[x.trim().toLowerCase()] = i);
  const get = (r, k) => (h[k] !== undefined ? (r[h[k]] || '') : '');
  return rows.slice(1).map(r => {
    const options = [];
    for (const L of LETTERS.toLowerCase()) { if (h[L] === undefined) break; options.push({ text: get(r, L), explanation: get(r, 'exp_' + L) }); }
    const cv = get(r, 'correct').trim(); let correct = LETTERS.indexOf(cv.toUpperCase());
    if (cv.length > 1 || correct < 0) correct = (parseInt(cv) || 1) - 1;
    return normQ({ stem: get(r, 'stem') || get(r, 'question'), options, correct, explanation: get(r, 'explanation'), objective: get(r, 'objective'), hint: get(r, 'hint'), exam: get(r, 'exam'),
      tags: get(r, 'tags').split(/[;,]/).map(s => s.trim()).filter(Boolean), difficulty: get(r, 'difficulty') }, fb);
  }).filter(Boolean);
}
async function handleFile(file) {
  const text = await file.text(); const fb = manageExam !== 'all' ? manageExam : state.exams[0].id; let added = 0;
  try {
    let list = [];
    if (/\.csv$/i.test(file.name)) list = csvToQuestions(text, fb);
    else {
      const j = JSON.parse(text);
      if (!Array.isArray(j) && j.bank && j.exams) {
        if (!(await ask('This is a full backup. Replace everything currently in BoardBank with it?', 'Restore backup'))) return;
        state = Object.assign({ bank: [], results: {}, history: [], exams: [], cards: {}, marks: {}, notes: {}, daily: {}, name: state.name }, j); migrate();
        await saveData(); toast('Backup restored'); return render();
      }
      list = (Array.isArray(j) ? j : (j.bank || [])).map(r => normQ(r, fb)).filter(Boolean);
    }
    list.forEach(q => state.bank.push(q)); added = list.length;
    await saveData(); toast(added ? `${added} question${added === 1 ? '' : 's'} imported` : 'No valid questions found in the file'); render();
  } catch (e) { toast('Could not read the file. Check the format.'); }
}

/* ================= performance ================= */
function renderStats() {
  const ids = Object.keys(state.results).filter(id => byId(id) && state.results[id].attempts > 0);
  const att = ids.reduce((s, id) => s + state.results[id].attempts, 0), cor = ids.reduce((s, id) => s + state.results[id].correct, 0);
  const cards = Object.keys(state.cards).filter(id => byId(id)), dueN = duePool().length;
  const mature = cards.filter(id => state.cards[id].interval >= 21).length;
  const hist = state.history.slice(-10).reverse().map(h => `<tr><td>${new Date(h.at).toLocaleString()}</td><td>${h.kind === 'review' ? 'Review' : h.mode === 'tutor' ? 'Tutor' : 'Exam'}</td><td>${h.correct}/${h.total}</td><td>${Math.round(100 * h.correct / h.total)}%</td></tr>`).join('');
  if (!att) return `<h1 class="title">Performance</h1><div class="card empty" style="margin-top:20px"><h2 style="font:700 22px var(--sans)">No results yet</h2><p style="margin:8px 0 0">Finish a session to see your performance here.</p></div>`;
  return `<h1 class="title">Performance</h1><section class="card" style="margin-top:20px"><div class="row" style="gap:44px"><div><div class="score100">${Math.round(100 * cor / att)}%</div><div class="muted">${cor} of ${att} answers correct</div></div>
    <div><div class="score100" style="font-size:46px">${cards.length}</div><div class="muted">in your review schedule</div></div>
    <div><div class="score100" style="font-size:46px">${mature}</div><div class="muted">well known (21+ day interval)</div></div>
    <div><div class="score100" style="font-size:46px">${dueN}</div><div class="muted">due now</div></div></div></section>
    ${hist ? `<section class="card" style="margin-top:20px"><h3 style="margin-bottom:8px">Recent sessions</h3><table><thead><tr><th>Date</th><th>Type</th><th>Score</th><th></th></tr></thead><tbody>${hist}</tbody></table></section>` : ''}`;
}

/* ================= events ================= */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t) { if (sess && sess.navOpen && !e.target.closest('.navpop')) { sess.navOpen = false; render(); } return; }
  const a = t.dataset.act, i = +t.dataset.i;
  switch (a) {
    case 'menu': document.body.classList.toggle('menu'); break;
    case 'home': view = 'home'; render(); window.scrollTo(0, 0); break;
    case 'openexam': curExam = t.dataset.id; view = 'exam'; render(); window.scrollTo(0, 0); break;
    case 'stats': view = 'stats'; render(); break;
    case 'manage': editing = null; view = 'manage'; render(); break;
    case 'addexam': manageTab = 'exams'; view = 'manage'; editing = null; render(); setTimeout(() => { const n = $('#newexam'); if (n) n.focus(); }, 30); break;
    case 'review': startReview(null); break;
    case 'sort': sortBy = sortBy === 'name' ? 'score' : sortBy === 'score' ? 'due' : 'name'; render(); break;
    case 'toggletopic': { const k = curExam + '|' + t.dataset.t; openTopics[k] = !openTopics[k]; render(); break; }
    case 'study': openSetup(t.dataset.t); break;
    case 'revtopic': startReview(t.dataset.t); break;
    case 'backex': view = 'exam'; render(); break;
    case 'swexam': setup.exam = !setup.exam; render(); break;
    case 'swseen': setup.seen = !setup.seen; render(); break;
    case 'start': startSession(); break;
    case 'pick': pick(i); break;
    case 'elim': { const q = cur(); const m = sess.elim[q.id] || (sess.elim[q.id] = {}); m[i] = !m[i]; if (m[i] && sess.ans[q.id] === i) delete sess.ans[q.id]; render(); break; }
    case 'optx': { const q = cur(), k = q.id + ':' + i; const good = i === q.correct, mine = i === sess.ans[q.id]; const curOpen = sess.open[k] !== undefined ? sess.open[k] : (good || mine); sess.open[k] = !curOpen; render(); break; }
    case 'submit': submitAnswer(); break;
    case 'rate': rate(t.dataset.r); break;
    case 'kf': { const q = cur(); sess.kf[q.id] = !sess.kf[q.id]; render(); break; }
    case 'navtoggle': sess.navOpen = !sess.navOpen; render(); break;
    case 'go': goTo(i); break;
    case 'prev': if (sess.idx > 0) goTo(sess.idx - 1); break;
    case 'next': if (sess.idx < sess.ids.length - 1) goTo(sess.idx + 1); break;
    case 'end': endBlock(); break;
    case 'mark': { const q = cur(); state.marks[q.id] = !state.marks[q.id]; if (!state.marks[q.id]) delete state.marks[q.id]; saveData(); render(); break; }
    case 'hint': { const q = cur(); if (!q.hint) toast('This question has no hint.'); else { sess.hint[q.id] = !sess.hint[q.id]; render(); } break; }
    case 'notefocus': { const n = $('#note'); if (n) { n.scrollIntoView({ block: 'center' }); n.focus(); } break; }
    case 'editcur': { const q = cur(); const keep = sess; editing = JSON.parse(JSON.stringify(q)); sess = null; clearInterval(timerId); view = 'manage'; manageTab = 'questions'; toast('Session closed so you can edit.'); render(); break; }
    case 'reviewq': sess.done = false; sess.review = true; sess.idx = i; sess.visited[sess.ids[i]] = 1; view = 'session'; clearInterval(timerId); timerId = setInterval(tick, 1000); render(); window.scrollTo(0, 0); break;
    case 'leave': sess = null; view = 'home'; render(); break;
    case 'mtab': editing = null; manageTab = t.dataset.k; render(); break;
    case 'newq': editing = blankDraft(); view = 'manage'; manageTab = 'questions'; render(); break;
    case 'editq': editing = JSON.parse(JSON.stringify(byId(t.dataset.id))); editing.hint = editing.hint || ''; render(); break;
    case 'delq': if (await ask('Delete this question? This cannot be undone.', 'Delete')) {
      state.bank = state.bank.filter(q => q.id !== t.dataset.id); delete state.results[t.dataset.id]; delete state.cards[t.dataset.id]; delete state.notes[t.dataset.id]; delete state.marks[t.dataset.id];
      saveData(); render(); } break;
    case 'addopt': collectDraft(); editing.options.push({ text: '', explanation: '' }); render(); break;
    case 'rmopt': collectDraft(); editing.options.splice(i, 1); if (editing.correct === i) editing.correct = 0; else if (editing.correct > i) editing.correct--; render(); break;
    case 'saveq': saveQuestion(); break;
    case 'cancelq': editing = null; render(); break;
    case 'doaddexam': { const n = $('#newexam').value.trim(); if (!n) return toast('Write a name for the exam.'); state.exams.push({ id: uid(), name: n, passMark: 65 }); saveData(); render(); break; }
    case 'delexam': { const ex = examById(t.dataset.id), n = examQs(ex.id).length;
      if (await ask(`Delete "${ex.name}"${n ? ' and its ' + n + ' question' + (n === 1 ? '' : 's') : ''}? This cannot be undone.`, 'Delete')) {
        state.bank.filter(q => q.exam === ex.id).forEach(q => { delete state.results[q.id]; delete state.cards[q.id]; });
        state.bank = state.bank.filter(q => q.exam !== ex.id); state.exams = state.exams.filter(x => x.id !== ex.id); if (manageExam === ex.id) manageExam = 'all'; saveData(); render(); } break; }
    case 'import': $('#file').click(); break;
    case 'export': download('qbank-backup.json', JSON.stringify({ version: 2, name: state.name, exams: state.exams, bank: state.bank, results: state.results, cards: state.cards, marks: state.marks, notes: state.notes, daily: state.daily, history: state.history }, null, 2), 'application/json'); break;
    case 'csvtpl': download('qbank-template.csv', 'exam,stem,a,b,c,d,e,correct,explanation,objective,hint,tags,difficulty,exp_a,exp_b,exp_c,exp_d,exp_e\n"Internal Medicine","Which vitamin deficiency causes scurvy?","Vitamin A","Vitamin B12","Vitamin C","Vitamin D","Vitamin K",C,"Vitamin C is needed for collagen synthesis.","Scurvy = vitamin C deficiency","Think about citrus and sailors","Nutrition;Basics",Easy,"","","Correct.","",""\n', 'text/csv'); break;
    case 'rename': { const n = prompt('Your name', state.name); if (n && n.trim()) { state.name = n.trim(); saveData(); render(); } break; }
    case 'logout': await sb.auth.signOut(); location.reload(); break;
    case 'reset': if (await ask('Delete all results, notes, bookmarks and review schedules? Your questions are kept.', 'Reset')) { state.results = {}; state.history = []; state.cards = {}; state.notes = {}; state.marks = {}; state.daily = {}; saveData(); render(); } break;
  }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'bq') { bankQuery = e.target.value; renderBankList(); }
  else if (id === 's-count') setup.count = e.target.value;
  else if (id === 's-h') setup.h = e.target.value;
  else if (id === 's-m') setup.m = e.target.value;
  else if (id === 'note' && sess) { const q = cur(); if (e.target.value.trim()) state.notes[q.id] = e.target.value; else delete state.notes[q.id]; saveSoon(); }
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 's-filter') { setup.filter = e.target.value; render(); }
  else if (id === 'mexam') { manageExam = e.target.value; render(); }
  else if (id === 'pm') { const ex = examById(curExam); ex.passMark = Math.min(100, Math.max(1, parseInt(e.target.value) || 65)); saveData(); render(); }
  else if (id === 'nm') { state.name = e.target.value.trim() || 'Doctor'; saveData(); renderSide(); }
  else if (id === 'file' && e.target.files[0]) { handleFile(e.target.files[0]); e.target.value = ''; }
  else if (e.target.classList.contains('ex-name') || e.target.classList.contains('ex-pm')) {
    const row = e.target.closest('[data-eid]'), ex = examById(row.dataset.eid);
    ex.name = row.querySelector('.ex-name').value.trim() || ex.name; ex.passMark = Math.min(100, Math.max(1, parseInt(row.querySelector('.ex-pm').value) || 65)); saveData(); renderSide();
  }
});
document.addEventListener('keydown', e => {
  const tg = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && tg.dataset && tg.dataset.act && tg.tagName !== 'BUTTON') { e.preventDefault(); tg.click(); return; }
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(tg.tagName) || view !== 'session' || !sess || sess.done) return;
  const q = cur(); if (!q) return;
  const rev = revealed(q);
  if (rev && ['1', '2', '3'].includes(e.key)) { rate(['hard', 'medium', 'easy'][+e.key - 1]); return; }
  const k = e.key.toUpperCase(), i = LETTERS.indexOf(k);
  if (!rev && k.length === 1 && i >= 0 && i < q.options.length && !e.ctrlKey && !e.metaKey) pick(i);
  else if (e.key === 'ArrowRight' && sess.idx < sess.ids.length - 1) goTo(sess.idx + 1);
  else if (e.key === 'ArrowLeft' && sess.idx > 0) goTo(sess.idx - 1);
  else if (e.key === 'Enter' && tg.tagName !== 'BUTTON') {
    if (!rev && sess.mode === 'tutor' && sess.ans[q.id] !== undefined) submitAnswer();
    else if (sess.idx < sess.ids.length - 1) goTo(sess.idx + 1);
  }
});

/* ================= boot ================= */
async function start(session) {
  me = session.user;
  const ok = await loadData(); migrate();
  if (!ok) { $('#au-m').textContent = 'Could not load your data. Reload to try again.'; return; }
  $('#auth').hidden = true; curExam = state.exams[0].id; view = 'home';
  if (!state.named) {
    const m = me.user_metadata && me.user_metadata.name;
    if (m) { state.name = m; state.named = true; saveData(); }
    else { $('#namebox').hidden = false; $('#nb-n').value = state.name === (me.email || '').split('@')[0] ? '' : state.name; $('#nb-n').focus(); }
  }
  render();
}
$('#nbf').addEventListener('submit', e => {
  e.preventDefault(); const n = $('#nb-n').value.trim(); if (!n) return;
  state.name = n; state.named = true; $('#namebox').hidden = true; saveData(); render();
});
let signup = false;
const amsg = t => { $('#au-m').textContent = t; };
function setMode(on) {
  signup = on; $('#au-t').textContent = on ? 'Create your account' : 'Sign in'; $('#au-go').textContent = on ? 'Create account' : 'Sign in';
  $('#au-nw').hidden = !on; $('#au-q').textContent = on ? 'Already have an account?' : 'New here?'; $('#au-sw').textContent = on ? 'Sign in' : 'Create an account';
  $('#au-p').autocomplete = on ? 'new-password' : 'current-password'; amsg('');
}
$('#au-sw').addEventListener('click', e => { e.preventDefault(); setMode(!signup); });
$('#authf').addEventListener('submit', async e => {
  e.preventDefault(); const email = $('#au-e').value.trim(), password = $('#au-p').value;
  if (signup) {
    const name = $('#au-n').value.trim();
    if (!name) return amsg('Write your name.'); if (password.length < 6) return amsg('Password must be at least 6 characters.');
    amsg('Creating account…');
    const r = await sb.auth.signUp({ email, password, options: { data: { name }, emailRedirectTo: location.origin + location.pathname } });
    if (r.error) return amsg(r.error.message);
    if (r.data.session) start(r.data.session); else { setMode(false); amsg('Account created. Confirm your email, then sign in.'); }
  } else {
    amsg('Signing in…');
    const r = await sb.auth.signInWithPassword({ email, password });
    if (r.error) return amsg(r.error.message); start(r.data.session);
  }
});
(async function () {
  const { data } = await sb.auth.getSession();
  if (data.session) start(data.session);
})();
